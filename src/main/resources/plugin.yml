name: SHNetworkLevel
version: '${project.version}'
main: org.Cry_Legende.sHNetworkLevel.SHNetworkLevel
api-version: '1.20'
author: Cry_Legende
# SHNetwork est facultatif : sans lui, le plugin garde son fonctionnement local (lobby, login, serveur seul).
softdepend: [PlaceholderAPI, SHNetwork]
# Charges par Paper dans le classloader du plugin : HikariCP doit voir le driver MariaDB,
# que le serveur ne fournit pas (il n'embarque que MySQL et SQLite).
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.4.1

commands:
  shnetworklevel:
    description: Administration du niveau de network (exp, niveau, consultation, rechargement).
    usage: /<command> <exp|level|info|reload> ...

permissions:
  shnetworklevel.admin:
    description: Toutes les sous-commandes de /shnetworklevel.
    default: op
    children:
      shnetworklevel.admin.exp: true
      shnetworklevel.admin.level: true
      shnetworklevel.admin.info: true
      shnetworklevel.admin.reload: true
  shnetworklevel.admin.exp:
    description: Donner, retirer ou définir l'exp d'un joueur (/shnetworklevel exp).
    default: op
  shnetworklevel.admin.level:
    description: Donner, retirer ou définir le niveau d'un joueur (/shnetworklevel level).
    default: op
  shnetworklevel.admin.info:
    description: Voir le niveau et l'exp d'un joueur (/shnetworklevel info).
    default: op
  shnetworklevel.admin.reload:
    description: Recharger config.yml et messages.yml (/shnetworklevel reload).
    default: op
