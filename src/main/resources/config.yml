# ======================================================================== #
#                   SHNetworkLevel - Configuration                         #
# ======================================================================== #
#
# Plugin : niveau de network des joueurs (niveau et exp), partagé entre les serveurs dans la table
# shnetworklevel de MariaDB (une ligne par pseudo), avec récompenses de level-up, son, barre de
# progression et placeholders.
#
# Commandes (racine /shnetworklevel, pas d'alias) :
#   /shnetworklevel exp <give|take|set> <joueur> <nombre>     Modifie l'exp. Un give ou un set fait monter de niveau
#                                                             tant que l'exp atteint le seuil.
#   /shnetworklevel level <give|take|set> <joueur> <nombre>   Modifie le niveau sans toucher à l'exp.
#   /shnetworklevel info <joueur>                             Niveau et exp du joueur.
#   /shnetworklevel reload                                    Recharge config.yml et messages.yml.
# Les autres plugins l'appellent en console (récompenses) : « shnetworklevel exp give <joueur> <nombre> ».
#
# Permissions (op par défaut) :
#   shnetworklevel.admin          Toutes les sous-commandes.
#   shnetworklevel.admin.exp      /shnetworklevel exp
#   shnetworklevel.admin.level    /shnetworklevel level
#   shnetworklevel.admin.info     /shnetworklevel info
#   shnetworklevel.admin.reload   /shnetworklevel reload
#
# Placeholders :
#   %shnetworklevel_exp%          La quantité d'exp du joueur
#   %shnetworklevel_level%        Le niveau du joueur
#   %shnetworklevel_expneeded%    Le total d'exp nécessaire pour passer au niveau suivant
#   %shnetworklevel_progressbar%  Une barre de progression visuelle basée sur la quantité d'exp actuelle par rapport au seuil requis
#   %shnetworklevel_bonus%                  Bonus d'exp des cosmétiques équipés, en pourcentage (15)
#   %shnetworklevel_bonus_texte%            « (+15%) » à mettre dans un message de gain, vide sans bonus (messages.yml : bonus)
#   %shnetworklevel_bonus_<source>%         Pourcentage de la source si le cosmétique est équipé, sinon 0 (titre, compagnon...)
#   %shnetworklevel_bonus_<source>_etat%    Ligne de menu : source équipée ou non avec son pourcentage (messages.yml : bonus)
#
# Les textes des messages sont dans messages.yml.
# Un reload valide config.yml et messages.yml avant de les appliquer : si l'un est invalide, rien ne change et le message
# donne le fichier et l'erreur. Progression, récompenses, son, barre de progression et valeurs par défaut sont lus à
# chaque usage, le bonus au reload. Demande un redémarrage : database, reseau.
#
# ======================================================================== #

# Paramètres de connexion à MariaDB
database:
  # host: 138.201.251.202
  host: 127.0.0.1
  port: 3306
  database: Global?autoReconnect=true&useSSL=false
  username: utilisateur
  password: "CHANGE_ME"

# Variables de progression
progression:
  type: "exponential"        # "linear" ou "exponential"
  base: 100
  increment: 50         # pour la progression linéaire
  multiplier: 1.50       # pour la progression exponentielle

# Niveau et exp d'un joueur sans ligne en base.
default-values:
  level: 0
  exp: 0

# Commandes de récompense lors d'un level-up
rewards:
  levelup-commands: # Variables: %player% et %level%
    - "bungeee lpb user %player% permission set ajqueue.priority.%level%"

# Configuration du son de level-up
sounds:
  levelup:
    sound: "BLOCK_BELL_RESONATE"
    volume: 1.0
    pitch: 2.0

# Configuration de la progress bar
Progress-bar:
  Amount: 15
  Character: "■"
  Complete: "&5"
  Remaining: "&7"

# Bonus d'exp de network des cosmétiques équipés. Chaque source équipée ajoute son pourcentage à l'exp donnée par
# « exp give » quand la commande vient de la console (récompenses des autres plugins) et que le joueur est connecté sur
# ce serveur. Une commande tapée par un joueur donne le nombre exact. Une source compte comme équipée quand son
# placeholder rend autre chose qu'un texte vide ou qu'une des valeurs-vides ; sans PlaceholderAPI ou sans le plugin du
# placeholder, elle ne compte pas. Les fractions d'exp de bonus sont gardées jusqu'au gain suivant du joueur.
bonus:
  actif: true
  valeurs-vides:
    - "0"
    - "false"
    - "none"
    - "aucun"
  sources:
    titre:
      nom: "Titre"
      placeholder: "%shtitres_id%"
      pourcentage: 5
    compagnon:
      nom: "Compagnon"
      placeholder: "%shcompagnons_current_pet_type%"
      pourcentage: 5
    particules:
      nom: "Particules"
      placeholder: "%playerparticles_active_amount%"
      pourcentage: 5

# Plusieurs serveurs Opale avec SHNetwork. Sans SHNetwork, ou avec 'actif: false', le plugin fonctionne comme sur
# un serveur seul : les valeurs du joueur sont gardées en cache et réécrites en entier à chaque commande.
# Avec SHNetwork, la ligne du joueur est relue sous verrou avant chaque modification : l'exp donnée depuis deux
# serveurs en même temps s'additionne. Le cache des joueurs connectés est relu quand un autre serveur écrit.
# Un niveau gagné par un joueur qui se trouve sur un autre serveur lui est annoncé là-bas et ses commandes de
# récompense y sont exécutées, une seule fois. La base est celle de la section 'database'.
reseau:
  actif: true
  # Canal du bus SHNetwork où les serveurs se préviennent d'une modification et d'un niveau gagné
  canal: networklevel
  # Relecture en base des joueurs connectés, en secondes, au cas où un message du bus se perdrait
  relecture-secondes: 60
